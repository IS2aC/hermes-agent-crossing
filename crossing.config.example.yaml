# crossing.config.example.yaml — Configuration des teams, bureaux, rôles et sprites
# Ce fichier NE CONTIENT AUCUN SECRET (les secrets sont dans .env)
# Validé par zod au démarrage ; erreur lisible si invalide.

instance:
  name: "Hermes Agent Crossing"
  slogan: "Open Agents Better Workflows"
  timezone: "Europe/Paris"
  day_night_cycle: true

# ───────── Profils Hermes (découverts via GET /api/profiles) ─────────
# Ne pas coder ces noms en dur dans l'application.
# Cette section ne sert qu'à définir le rôle, la team, le bureau et le sprite de chaque profil connu.
# Les profils découverts sur Hermes mais absents d'ici sont placés dans l'open space général.

profiles:
  - id: "default"                    # = Jarvis (profil par défaut Hermes)
    display_name: "Jarvis"
    role: "Manager général"
    team: null                       # bureau privé
    office: "private"
    is_manager: true
    sprite:
      base: "exec"
      palette: ["#1e2952", "#30f5ff", "#ffffff"]

  - id: "dev-manager"
    display_name: "Dev Manager"
    role: "Manager équipe dev"
    team: "dev"
    office: "desk"
    is_manager: true
    sprite:
      base: "lead"
      palette: ["#30f5ff", "#1e2952", "#ffffff"]

  - id: "x"
    display_name: "Agent X"
    role: "Senior Developer"
    team: "dev"
    office: "desk"
    is_manager: false
    sprite:
      base: "dev_hoodie"
      palette: ["#30f5ff", "#c8804c", "#ffffff"]

  - id: "designer"
    display_name: "Designer"
    role: "Designer UI/UX"
    team: "dev"
    office: "desk"
    is_manager: false
    sprite:
      base: "creative"
      palette: ["#a39cff", "#30f5ff", "#ffffff"]

  - id: "tester"
    display_name: "Tester"
    role: "Tests automatisés"
    team: "dev"
    office: "desk"
    is_manager: false
    sprite:
      base: "qa"
      palette: ["#74b100", "#30f5ff", "#ffffff"]

  - id: "reviewer"
    display_name: "Reviewer"
    role: "Relecture PR"
    team: "dev"
    office: "desk"
    is_manager: false
    sprite:
      base: "glasses"
      palette: ["#ffca4e", "#30f5ff", "#ffffff"]

  - id: "veilleur"
    display_name: "Veilleur"
    role: "Recherche & veille"
    team: null                       # open space général
    office: "desk"
    is_manager: false
    sprite:
      base: "explorer"
      palette: ["#f79b39", "#30f5ff", "#ffffff"]

# ───────── Teams ─────────
teams:
  - id: "dev"
    name: "Team Dev"
    manager_id: "dev-manager"
    member_ids: ["dev-manager", "x", "designer", "tester", "reviewer"]
    color: "#30f5ff"                  # cyan néon (comme les icônes d'enseigne de la maquette)
    open_space:
      desk_layout: "islands"          # îlots face à face
      manager_desk: "separate"        # bureau manager distinct avec tableau blanc

# ───────── Prefabs de pièces (fichiers Tiled .tmj dans assets-src/maps/) ─────────
rooms:
  hall:
    prefab: "hall.tmj"
    required: true
  private_office:
    prefab: "private_office.tmj"
    required: true
  open_space_general:
    prefab: "open_space_general.tmj"
    required: true
  team_open_space_2:
    prefab: "team_open_space_2.tmj"
  team_open_space_4:
    prefab: "team_open_space_4.tmj"
  team_open_space_6:
    prefab: "team_open_space_6.tmj"
  team_open_space_8:
    prefab: "team_open_space_8.tmj"
  kanban_room:
    prefab: "kanban_room.tmj"
    required: true
  coffee_corner:
    prefab: "coffee_corner.tmj"
    required: true
  server_room:
    prefab: "server_room.tmj"
    required: true

# ───────── Points d'intérêt (pour pathfinding & décor) ─────────
poi:
  - id: "coffee_machine"
    room: "coffee_corner"
    weight: 20
  - id: "plants"
    room: "all"
    variants: 5
    weight: 15
  - id: "team_sign"
    room: "team_open_space_*"
    required: true
  - id: "kanban_wall"
    room: "kanban_room"
    required: true

# ───────── Sprites de base disponibles (dans assets-src/sprites/) ─────────
sprite_bases:
  - exec          # dirigeant, costume
  - lead          # manager, chemise
  - dev_hoodie    # dev, hoodie
  - creative      # designer, tenue décontractée
  - qa            # tester, blouse/lunettes
  - glasses       # reviewer, lunettes
  - explorer      # veilleur, veste
  - generic       # recolorable, fallback

# ───────── Palette officielle (assets-src/palette.gpl) ─────────
# 24 couleurs actives + 8 réservées = 32 max
# Voir docs/SPEC.md §8 pour la liste complète des hex codes.
# AGENTS.md — Règles de travail de l'équipe sur Hermes Agent Crossing

À lire **avant toute action** par chaque agent (dev_manager, agent_x, designer, tester, reviewer).

## Documents de référence (ordre de priorité)
1. `docs/SPEC.md` — cahier des charges, source de vérité.
2. `docs/HERMES_CONTRACT.md` — contrat vérifié avec Hermes (produit en phase 1). **Interdit d'utiliser un endpoint Hermes qui n'y figure pas.**
3. `docs/DESIGN_SYSTEM.md` — règles visuelles (produit en phase 3).
4. `docs/PROMPTS.md` — séquence des phases et critères d'acceptation.
5. `docs/adr/` — décisions qui modifient la SPEC.

## Rôles
| Agent | Responsabilité | Ne fait pas |
|---|---|---|
| `dev_manager` | Découpe chaque phase en cartes Kanban, assigne, arbitre, merge après review, tient `CHANGELOG.md` et l'état d'avancement dans `docs/STATUS.md` | N'écrit pas de code de production sauf déblocage |
| `agent_x` | Architecture, backend, intégration Hermes, moteur de jeu, packaging | Ne merge pas ses propres PR |
| `designer` | Palette, tilesets, sprites, UI kit, maquettes, `DESIGN_SYSTEM.md`, intégration CSS des composants | Ne modifie pas la logique métier |
| `tester` | Mock Hermes, tests unitaires/intégration/E2E, scénarios de panne, rapports de bugs | Ne corrige pas lui-même un bug hors tests (il ouvre une carte) |
| `reviewer` | Relit chaque PR avec la checklist ci-dessous, approuve ou demande des changements | N'approuve pas une PR dont la CI est rouge |

## Flux Git
- Branche `main` protégée : merge uniquement via PR, CI verte + 1 approbation `reviewer`.
- Branches : `feat/<phase>-<sujet>`, `fix/<sujet>`, `chore/<sujet>`, `docs/<sujet>`.
- Commits **Conventional Commits** (`feat(server): …`, `fix(web): …`).
- Une PR = une carte Kanban = un objectif. PR < 600 lignes modifiées hors assets/lockfile, sinon découper.
- Description de PR : lien carte, quoi/pourquoi, captures ou GIF pour tout changement visuel, comment tester.
- Tags SemVer : `v0.<phase>.0` à la fin de chaque phase, `v1.0.0` à la livraison.

## Règles de code
- TypeScript `strict`, pas de `any` non justifié (commentaire `// why:`).
- Toute donnée venant de Hermes passe par un schéma zod de `packages/shared` ou `apps/server/src/hermes/schemas`.
- Aucun secret dans le code, les tests, les fixtures, les logs ou les captures.
- Le navigateur n'appelle jamais Hermes directement.
- Aucun nom d'agent codé en dur hors fixtures de test et fichier d'exemple.
- ESLint + Prettier passent ; `pnpm typecheck && pnpm lint && pnpm test` avant chaque push.
- Les assets : sources dans `assets-src/`, exports générés dans `apps/web/public/assets/` par script (`pnpm assets:build`). Toute ressource externe = CC0/OFL/MIT et listée dans `assets-src/CREDITS.md`. **Aucun asset issu de Pokémon ou d'un autre jeu.**

## Checklist reviewer (à copier dans chaque review)
- [ ] La PR répond à la carte et aux critères d'acceptation de la phase
- [ ] CI verte (lint, typecheck, tests, build)
- [ ] Tests ajoutés/à jour pour le comportement modifié
- [ ] Pas de secret, pas de log de clé, pas d'appel Hermes côté navigateur
- [ ] Endpoints Hermes conformes à `HERMES_CONTRACT.md`, erreurs (401/429/503/timeout) gérées
- [ ] Changement visuel conforme à `DESIGN_SYSTEM.md` (pixel-perfect, palette, échelle entière), capture fournie
- [ ] Accessibilité : accessible au clavier, libellés, `prefers-reduced-motion`
- [ ] Docs/CHANGELOG mis à jour si comportement utilisateur modifié

## Definition of Done d'une carte
Code mergé sur `main` · tests verts · doc à jour · démo (capture/GIF) postée en commentaire de la carte · `docs/STATUS.md` mis à jour par dev_manager.

## Communication
- Les questions bloquantes au propriétaire produit passent par **Jarvis**, en une seule fois par phase, sous forme de liste numérotée avec une proposition par défaut pour chaque point.
- Si une info de la SPEC est contredite par Hermes réel : on suit Hermes, on écrit un ADR, on prévient dev_manager.
